services:
  language-reader:
    # Built from this repository's source; there is no published image.
    # pull_policy: build skips the registry pull that Portainer runs before
    # starting a stack (which would fail for a local-only image) and rebuilds
    # on every deploy, so "Pull and redeploy" picks up new commits.
    build:
      context: .
      args:
        # Set to 0 to leave out Voikko (offline Finnish morphology hints).
        WITH_VOIKKO: ${WITH_VOIKKO:-1}
    pull_policy: build
    container_name: language-reader
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8413}:8080"
    volumes:
      # reader.db lives here: texts, vocabulary, settings, translation cache.
      # Defaults to a named volume; set DATA_PATH to an absolute host path to
      # bind-mount a folder instead.
      - ${DATA_PATH:-language-reader-data}:/data
    environment:
      DATA_DIR: /data
      PORT: "8080"
      # Optional. Set as stack environment variables in Portainer (or in .env).
      # Backend choices and keys saved on the Settings page take precedence.
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
    # Lets the Settings page reach Ollama or LM Studio on the host as
    # http://host.docker.internal:11434/v1 (needed on Linux, harmless elsewhere).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Uncomment when DATA_PATH is a bind mount, so files are owned by you.
    # user: "1000:1000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  language-reader-data:
