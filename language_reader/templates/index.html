<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Language Reader</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232b5f8f'/><text x='16' y='23' font-size='15' text-anchor='middle' fill='white' font-family='Georgia'>Aa</text></svg>">
<style>
:root {
  --bg: #faf8f3; --surface: #ffffff; --surface-2: #f2efe7; --text: #1f1e1b; --muted: #6d6a62;
  --border: #e4dfd3; --accent: #2b5f8f; --accent-soft: rgba(43,95,143,.10); --accent-text: #fff;
  --new-bg: rgba(240,194,75,.32); --new-line: #d9a514;
  --learning-bg: rgba(232,135,58,.22); --learning-line: #d0701f;
  --known-line: #4f9a6c;
  --phrase-line: #2b5f8f; --danger: #b33a2f; --ok: #2f7d4f;
  --cefr-a: #2f7d4f; --cefr-b: #2b5f8f; --cefr-c: #7a4cb0;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.06);
  --serif: "Literata", "PT Serif", "Iowan Old Style", "Charter", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --surface: #1f1f1d; --surface-2: #2a2926; --text: #ecebe6; --muted: #a19d93;
    --border: #3a3833; --accent: #7fb0e0; --accent-soft: rgba(127,176,224,.14); --accent-text: #0f1b27;
    --new-bg: rgba(240,194,75,.22); --new-line: #e6bb45;
    --learning-bg: rgba(232,135,58,.26); --learning-line: #ec9550;
    --known-line: #6cc08b; --phrase-line: #7fb0e0; --danger: #ef7d71; --ok: #6cc08b;
    --cefr-a: #6cc08b; --cefr-b: #7fb0e0; --cefr-c: #b996e6;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans); }
a { color: var(--accent); }
h1 { font-size: 1.45rem; margin: 0; font-weight: 650; letter-spacing: -.01em; }
h2 { font-size: 1.05rem; margin: 0 0 .75rem; font-weight: 650; }
button, input, select, textarea { font: inherit; color: inherit; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.top-inner { max-width: 1240px; margin: 0 auto; padding: 0 16px; height: 52px; display: flex; align-items: center; gap: 20px; }
.brand { font: 600 1.15rem var(--serif); color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 8px; }
.brand .mark { width: 26px; height: 26px; border-radius: 6px; background: var(--accent); color: var(--accent-text);
  display: grid; place-items: center; font-size: .78rem; font-family: var(--serif); }
nav { display: flex; gap: 2px; overflow-x: auto; }
nav a { text-decoration: none; color: var(--muted); padding: 6px 10px; border-radius: 6px; white-space: nowrap; }
nav a:hover { color: var(--text); background: var(--surface-2); }
nav a.active { color: var(--text); background: var(--surface-2); font-weight: 550; }

main { max-width: 1240px; margin: 0 auto; padding: 24px 16px 80px; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.loading, .spinner { color: var(--muted); padding: 12px 0; }
.spinner::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 8px; vertical-align: -1px;
  border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-box { border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent); background: color-mix(in srgb, var(--danger) 8%, transparent);
  color: var(--text); padding: 12px 14px; border-radius: 8px; }
.error-box b { color: var(--danger); }

/* controls */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface);
  padding: 7px 13px; border-radius: 7px; cursor: pointer; text-decoration: none; color: var(--text); white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.danger { color: var(--danger); }
button.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; }
button.link.danger { color: var(--danger); }
button.icon { background: none; border: 1px solid transparent; border-radius: 6px; width: 30px; height: 30px; cursor: pointer; color: var(--muted); }
button.icon:hover { border-color: var(--border); color: var(--text); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 550; }
input[type=text], input[type=url], input[type=password], input[type=search], input:not([type]), select, textarea {
  background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 7px 10px; width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
textarea { resize: vertical; line-height: 1.6; }
label.field { display: block; margin-bottom: 14px; }
label.field > span { display: block; font-weight: 550; margin-bottom: 4px; font-size: .9rem; }
label.field small { display: block; color: var(--muted); margin-top: 4px; font-size: .82rem; }
div.field { margin-bottom: 14px; }
.field-label { display: block; font-weight: 550; margin-bottom: 4px; font-size: .9rem; }
.detect-hint { display: block; color: var(--muted); margin-top: 6px; font-size: .82rem; min-height: 1.2em; }
.detect-hint.warn { color: var(--danger); }

.badge { display: inline-block; font-size: .72rem; font-weight: 650; letter-spacing: .04em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 4px; background: var(--surface-2); color: var(--muted); }
.badge.lang { background: hsl(var(--h) 60% 50% / .14); color: hsl(var(--h) 55% 36%); }
@media (prefers-color-scheme: dark) { .badge.lang { color: hsl(var(--h) 65% 72%); } }
.seg-wrap { flex-wrap: wrap; }
.lang-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.voice-row { margin: 10px 0; }
.piper-list { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.piper-voice { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 10px; flex-wrap: wrap; }
.piper-voice + .piper-voice { border-top: 1px solid var(--border); }
.piper-voice.on { background: var(--accent-soft); }
.piper-voice label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.piper-voice .pv-name { font-weight: 550; }
.pv-actions { display: inline-flex; align-items: center; gap: 6px; }
.pv-meter { width: 90px; margin: 0; }
.voice-row > b { display: block; font-size: .88rem; margin-bottom: 4px; }
.voice-row input[type=range] { width: 100%; }
.lang-chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border); background: var(--surface-2);
  border-radius: 999px; padding: 3px 4px 3px 12px; }
.lang-chip .code { color: var(--muted); font-size: .78rem; }
.lang-chip button { border: 0; background: none; cursor: pointer; color: var(--muted); width: 24px; height: 24px; border-radius: 50%; }
.lang-chip button:hover { background: var(--border); color: var(--danger); }
.lang-chip button:disabled { opacity: .3; cursor: default; background: none; color: var(--muted); }
.add-lang { display: flex; gap: 8px; }
.add-lang select { flex: 1; }
.cefr { display: inline-block; font: 700 .72rem var(--sans); padding: 2px 6px; border-radius: 4px; border: 1px solid currentColor; }
.cefr-A { color: var(--cefr-a); } .cefr-B { color: var(--cefr-b); } .cefr-C { color: var(--cefr-c); }

/* library */
.stats-strip { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 10px 14px; min-width: 180px; }
.stat .n { font-size: 1.3rem; font-weight: 650; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.text-card { display: flex; flex-direction: column; align-items: flex-start; text-decoration: none; color: inherit;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px; transition: border-color .15s, box-shadow .15s; }
.text-card:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.text-card h3 { margin: 8px 0 6px; font: 600 1.05rem/1.35 var(--serif); display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; }
.text-card .preview { color: var(--muted); font-family: var(--serif); font-size: .92rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.text-card .meta { margin-top: auto; padding-top: 10px; align-self: stretch; border-top: 1px solid var(--border);
  color: var(--muted); font-size: .8rem; }
.text-card .preview { margin-bottom: 10px; }
.empty { text-align: center; padding: 56px 16px; border: 1px dashed var(--border); border-radius: 12px; color: var(--muted); }
.empty p { margin: 0 0 14px; }

/* new text */
.form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; max-width: 860px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-card textarea { font-family: var(--serif); font-size: 1.05rem; }

/* reader */
.reader-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.rh-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.rh-title h1 { font-family: var(--serif); }
.rh-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.reader-body { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start; }
.text { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px 32px; font: 1.22rem/1.9 var(--serif); }
.text .flow { white-space: pre-wrap; overflow-wrap: break-word; }
.text.parallel { padding: 8px 0; }
.text .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 10px 24px; border-bottom: 1px solid var(--border); }
.text .row:last-child { border-bottom: 0; }
.text .row .tr { font: .98rem/1.6 var(--sans); color: var(--muted); padding-top: 4px; }
.text .row .tr.missing > span { opacity: .5; }
.text .row .tr { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
button.speak { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 3px 5px; border-radius: 5px;
  display: inline-flex; align-items: center; gap: 5px; vertical-align: middle; line-height: 1; font: inherit; font-size: .85rem; }
button.speak:hover { color: var(--accent); background: var(--accent-soft); }
button.speak.speaking { color: var(--accent); background: var(--accent-soft); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.speak-pair { display: inline-flex; align-items: center; gap: 1px; vertical-align: middle; }
button.speak.slow span { font-size: .72rem; font-weight: 600; letter-spacing: .02em; }
.sel-btn .speak-pair { gap: 6px; }
button.speak.btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 6px 11px; }
button.speak.btn:hover { background: var(--surface-2); }
.surface button.speak, .k button.speak { margin-left: 2px; text-transform: none; letter-spacing: 0; font-weight: 400; }
.row-actions { display: inline-flex; align-items: center; gap: 2px; flex: none; }
.sel-btn { display: flex; gap: 6px; }
button.star { border: 0; background: none; cursor: pointer; color: var(--muted); line-height: 1; padding: 3px 5px; border-radius: 5px; flex: none;
  display: inline-flex; align-items: center; gap: 5px; font: inherit; font-size: .85rem; }
button.star:hover { color: var(--accent); background: var(--accent-soft); }
button.star.on { color: var(--accent); }
button.star.btn { font-size: .88rem; border: 1px solid var(--border); padding: 5px 10px; }
.pb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.pb-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.pb-card .pb-src { font: 600 1.14rem/1.45 var(--serif); padding-bottom: 9px; margin-bottom: 3px;
  border-bottom: 1px solid var(--border); }
.pb-card .pb-tr { font-size: .93rem; color: color-mix(in srgb, var(--text) 78%, var(--muted)); }
.pb-card .pb-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; padding-top: 6px; color: var(--muted); font-size: .8rem; }
/* Word highlights. Each word's box is padded to the full line height, so
   hovering or clicking anywhere in its line slot hits it (the text is set at
   line-height 1.9, which otherwise leaves gaps above and below the letters).
   The colours are clipped to the text itself: status as background-color,
   hover/selection and the phrase underline as background-image layers on
   top, so they show on coloured words too. box-decoration-break keeps a word
   that wraps at a hyphen (linja-|auto) highlighted on both lines. */
.w { cursor: pointer; border-radius: 3px; --hl: transparent; --phl: transparent;
  padding: .31em 0;
  background-image: linear-gradient(var(--hl), var(--hl)), linear-gradient(var(--phl), var(--phl));
  background-size: 100% 100%, 100% 2px; background-position: 0 0, 0 100%; background-repeat: no-repeat;
  background-clip: content-box;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
  transition: background-color .1s; }
.w:hover { --hl: var(--accent-soft); }
.text.selecting .w:hover { --hl: transparent; }
.w.st-new { background-color: var(--new-bg); }
.w.st-learning { background-color: var(--learning-bg); }
.w.st-known { text-decoration: underline 1px var(--known-line); text-underline-offset: 4px; }
/* "Meanings above": the meaning of each looked-up word written over it, like
   a correction pencilled above the line. Known words are left bare. */
.text.glosses .flow, .text.glosses .orig { line-height: 2.85; }
.text.glosses .w[data-gloss] { position: relative; }
.text.glosses .w[data-gloss]:not(.st-known)::before {
  content: attr(data-gloss); position: absolute; left: 50%; bottom: calc(100% - .38em); transform: translateX(-50%);
  max-width: 11em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font: italic 500 .56em/1.15 var(--sans); color: var(--accent); pointer-events: none; }
.w.ph { --phl: var(--phrase-line); }
.w.active, .w.active:hover { --hl: color-mix(in srgb, var(--accent) 24%, transparent); }
/* While dragging, whole words (and the spaces between them) light up instead
   of the browser's character-by-character selection. */
.text { --sel: color-mix(in srgb, var(--accent) 30%, transparent); }
.text.selecting.has-live ::selection { background: transparent; }
.w.sel-live, .text.selecting .w.sel-live:hover { --hl: var(--sel); }
.g.sel-live { background: var(--sel); }
.text ::selection { background: var(--sel); }
.sent { border-radius: 4px; }
.sel-btn { position: absolute; z-index: 30; }
.sel-btn .btn { box-shadow: var(--shadow); padding: 5px 11px; font-size: .88rem; }

.panel { position: sticky; top: 68px; max-height: calc(100vh - 84px); overflow: auto; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; }
.card .k { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; margin-right: 6px; }
.wc-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.surface { color: var(--muted); font: 1rem var(--serif); }
.lemma-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: 2px 0 8px; }
.lemma { font: 600 1.6rem/1.2 var(--serif); }
.pos { color: var(--muted); font-style: italic; }
.gloss { font-size: 1.1rem; font-weight: 550; margin-bottom: 8px; }
.morph { color: var(--muted); margin-bottom: 10px; }
.kv { margin: 6px 0; }
.notes { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; margin: 10px 0; font-size: .92rem; }
.status-seg { margin: 12px 0 4px; }
.st-btn.st-new.on { background: var(--new-bg); color: var(--text); }
.st-btn.st-learning.on { background: var(--learning-bg); color: var(--text); }
.st-btn.st-known.on { background: color-mix(in srgb, var(--known-line) 22%, transparent); color: var(--text); }
.sent-box { border-top: 1px solid var(--border); margin-top: 14px; padding-top: 10px; }
.sent-tr { font-size: .93rem; color: var(--muted); }
details.chat { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px; }
details.chat > summary { cursor: pointer; font-size: .88rem; font-weight: 550; color: var(--accent); list-style: none; }
details.chat > summary::-webkit-details-marker { display: none; }
details.chat > summary::before { content: "›"; display: inline-block; width: 1em; transition: transform .15s; }
details.chat[open] > summary::before { transform: rotate(90deg); }
.chat-count { color: var(--muted); font-weight: 400; }
.chat-body { margin-top: 10px; }
.chat-log { display: flex; flex-direction: column; gap: 8px; max-height: 340px; overflow-y: auto; }
.chat-log:empty { display: none; }
.bubble { padding: 8px 11px; border-radius: 12px; font-size: .9rem; max-width: 92%; overflow-wrap: anywhere; }
.bubble.user { align-self: flex-end; background: var(--accent); color: var(--accent-text); border-bottom-right-radius: 4px; white-space: pre-wrap; }
.bubble.assistant { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 4px; }
.bubble .md p { margin: 0 0 6px; } .bubble .md p:last-child { margin-bottom: 0; }
.bubble .md ul, .bubble .md ol { margin: 4px 0 6px; padding-left: 20px; }
.bubble .md code { font-size: .85em; background: var(--border); padding: 0 3px; border-radius: 3px; }
.bubble-meta { display: flex; align-items: center; gap: 4px; margin-top: 4px; font-size: .72rem; color: var(--muted); }
.chat-input { margin-top: 8px; }
.chat-input textarea { font-size: .9rem; resize: vertical; }
.chat-send { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.chat-send select { width: auto; padding: 3px 6px; font-size: .8rem; }
.btn.chat-send-btn { padding: 5px 14px; font-size: .88rem; }
.escalate { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 10px 0 2px; }
.btn.esc-btn { padding: 3px 9px; font-size: .8rem; }
.card-foot { display: flex; justify-content: space-between; gap: 12px; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border); font-size: .88rem; }
.phrase-src { font: 1.12rem/1.5 var(--serif); margin: 4px 0 10px; }
.help p { margin: 0 0 8px; color: var(--muted); font-size: .92rem; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .85rem; margin-top: 8px; }
.legend span.sw { display: inline-block; width: 22px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
.phrase-list { list-style: none; padding: 0; margin: 0; }
.phrase-list li { padding: 8px 0; border-top: 1px solid var(--border); cursor: pointer; }
.phrase-list li:first-child { border-top: 0; }
.phrase-list li:hover .p-src { color: var(--accent); }
.p-src { font-family: var(--serif); }
.p-tr { color: var(--muted); font-size: .88rem; }
.close-sheet { display: none; }
.sheet-bar { display: none; }

/* vocab */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.filters select { width: auto; max-width: 100%; }
.filters input[type=search] { width: 240px; max-width: 100%; }
.table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 650; background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
tr.word-row { cursor: pointer; }
tr.word-row:hover td { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
td .lemma-cell { font: 600 1.08rem var(--serif); }
td .ex { color: var(--muted); font: .88rem var(--serif); margin-top: 3px; }
td .ex b { color: var(--text); font-weight: 600; }
td select { width: auto; padding: 3px 6px; font-size: .85rem; }
tr.detail td { background: var(--surface-2); }
.occ { padding: 8px 0; border-top: 1px solid var(--border); }
.occ:first-child { border-top: 0; }
.occ .s { font-family: var(--serif); }
.occ .s b { background: var(--new-bg); border-radius: 3px; font-weight: 600; }
/* vocabulary grid */
.grid-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.grid-head .legend { margin: 0; color: var(--muted); }
.legend .sw.st-new { background: var(--new-line); } .legend .sw.st-learning { background: var(--learning-line); } .legend .sw.st-known { background: var(--known-line); }
.grid-head .legend .sw { width: 10px; height: 10px; border-radius: 2px; }
.lang-h { display: flex; align-items: center; gap: 8px; font-size: .95rem; font-weight: 500; color: var(--muted); margin: 22px 0 4px; }
.letter-index { position: sticky; top: 52px; z-index: 5; background: var(--bg); display: flex; flex-wrap: wrap; gap: 2px;
  padding: 8px 0; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
.letter-index a { min-width: 30px; text-align: center; padding: 3px 7px; border-radius: 6px; text-decoration: none;
  font: 600 .95rem var(--serif); color: var(--text); }
.letter-index a:hover { background: var(--accent-soft); color: var(--accent); }
.vsec { margin-bottom: 24px; scroll-margin-top: 112px; }
.vsec-h { font: 600 1.35rem var(--serif); margin: 0 0 10px; padding-bottom: 4px; border-bottom: 1px solid var(--border);
  display: flex; align-items: baseline; gap: 10px; }
.vsec-h .n { font: .78rem var(--sans); color: var(--muted); }
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
.vcard { --st: var(--border); text-align: left; font: inherit; color: inherit; cursor: pointer; background: var(--surface);
  border: 1px solid var(--border); border-left: 4px solid var(--st); border-radius: 8px; padding: 9px 11px;
  display: flex; flex-direction: column; gap: 3px; min-height: 86px; transition: border-color .12s, box-shadow .12s; }
.vcard:hover { border-color: var(--accent); border-left-color: var(--st); box-shadow: var(--shadow); }
.vcard.st-new { --st: var(--new-line); } .vcard.st-learning { --st: var(--learning-line); } .vcard.st-known { --st: var(--known-line); }
.vc-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.vc-word { font: 600 1.08rem/1.25 var(--serif); overflow-wrap: anywhere; }
.vc-top .cefr { flex: none; font-size: .66rem; padding: 1px 4px; }
.vc-gloss { font-size: .88rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.vc-meta { font-size: .74rem; color: var(--muted); margin-top: auto; }
dialog.word-dialog { border: 1px solid var(--border); border-radius: 14px; padding: 0; width: min(580px, calc(100vw - 32px));
  max-height: 86vh; background: var(--surface); color: var(--text); box-shadow: 0 10px 40px rgba(0,0,0,.25); }
dialog.word-dialog::backdrop { background: rgba(0,0,0,.4); }
.wd-body { padding: 16px 20px 18px; overflow: auto; max-height: 86vh; }
.wd-body .k { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; margin-right: 6px; }
.wd-body select { width: auto; padding: 3px 6px; }
.occ-list { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px; }
.occ-list .k + .occ { border-top: 0; }
.cefr-bar { display: flex; gap: 6px; flex-wrap: wrap; font-size: .82rem; margin-top: 4px; }
.cefr-bar span { color: var(--muted); }

/* settings */
.settings-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; max-width: 1100px; }
.presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; margin-bottom: 18px; }
.preset { text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: 9px; padding: 9px 11px; cursor: pointer; }
.preset:hover { border-color: var(--accent); }
.preset.on { border-color: var(--accent); background: var(--accent-soft); }
.preset b { display: block; font-weight: 600; }
.preset small { color: var(--muted); }
.radio-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
.radio-row label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.key-row { display: flex; gap: 8px; }
.key-row input { flex: 1; }
.test-result { margin-top: 14px; border-radius: 9px; padding: 12px 14px; font-size: .92rem; }
.test-result.ok { background: color-mix(in srgb, var(--ok) 10%, transparent); border: 1px solid color-mix(in srgb, var(--ok) 35%, transparent); }
.test-result.fail { background: color-mix(in srgb, var(--danger) 9%, transparent); border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent); }
.test-result pre { white-space: pre-wrap; margin: 8px 0 0; font-size: .82rem; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.dot.on { background: var(--ok); } .dot.off { background: var(--muted); opacity: .5; }
.usage-bars { display: flex; align-items: flex-end; gap: 2px; height: 64px; margin-top: 6px; border-bottom: 1px solid var(--border); }
.usage-bars > div { flex: 1; background: var(--accent); opacity: .8; border-radius: 2px 2px 0 0; }
.usage-bars > div.zero { background: var(--border); opacity: 1; }
.bars-axis { display: flex; justify-content: space-between; margin-top: 2px; }
.meter { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin: 4px 0 6px; }
.meter > div { height: 100%; background: var(--accent); }
input.price-input { width: 90px; padding: 4px 8px; }
hr.sep { border: 0; border-top: 1px solid var(--border); margin: 20px 0; }

#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
#toast div { background: var(--text); color: var(--bg); padding: 9px 14px; border-radius: 8px; box-shadow: var(--shadow); font-size: .9rem; max-width: min(90vw, 520px); }
#toast div.error { background: var(--danger); color: #fff; }

/* stars */
:root { --star: #c48600; }
@media (prefers-color-scheme: dark) { :root { --star: #f2c14e; } }
button.fav { background: none; border: 1px solid transparent; border-radius: 6px; width: 30px; height: 30px; padding: 0; cursor: pointer;
  color: var(--muted); display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; }
button.fav:hover { border-color: var(--border); color: var(--text); }
button.fav.on { color: var(--star); }
.vc-star { color: var(--star); display: inline-flex; vertical-align: -2px; margin-left: 4px; }
.btn.star-filter.on { color: var(--star); border-color: var(--star); background: color-mix(in srgb, var(--star) 10%, var(--surface)); }
.btn svg { flex: none; }
nav .count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 5px; border-radius: 9px; background: var(--accent);
  color: var(--accent-text); font-size: .7rem; font-weight: 650; line-height: 17px; text-align: center; vertical-align: 1px; }
nav .count:empty { display: none; }

/* flashcard review */
.rv-wrap { max-width: 720px; margin: 0 auto; }
.rv-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.rv-tools label { display: inline-flex; align-items: center; gap: 6px; font-size: .88rem; color: var(--muted); }
.rv-tools input[type=number] { width: 64px; padding: 5px 7px; }
.rv-tools select { width: auto; }
.rv-card .k { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; margin-right: 6px; }
.rv-meta { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: .85rem; }
.rv-bar { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; margin: 6px 0 16px; }
.rv-bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.rv-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px 28px 22px; box-shadow: var(--shadow); }
.rv-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 14px; }
.rv-head .tags { display: flex; gap: 6px; align-items: center; font-size: .78rem; color: var(--muted); }
.rv-sentence { font: 1.35rem/1.75 var(--serif); }
.rv-word { background: var(--accent-soft); border-radius: 4px; padding: 1px 3px; font-weight: 600; }
.rv-gap { display: inline-block; border-bottom: 2px solid var(--accent); margin: 0 2px; line-height: 1.2; text-align: center; }
.rv-gap.filled { color: var(--accent); font-weight: 600; }
.rv-lemma-q { font: 600 1.8rem/1.25 var(--serif); }
.rv-hint { color: var(--muted); margin-top: 10px; }
.rv-hint b { color: var(--text); font-weight: 600; }
.rv-input { display: flex; gap: 8px; margin-top: 16px; }
.rv-input input { flex: 1; min-width: 0; font: 1.1rem var(--serif); padding: 7px 10px; }
.rv-check { margin-top: 8px; font-size: .92rem; }
.rv-check.ok { color: var(--ok); } .rv-check.bad { color: var(--danger); }
.rv-show { margin-top: 18px; display: flex; justify-content: center; }
.rv-show .btn { min-width: 180px; justify-content: center; padding: 9px 18px; }
.rv-answer { border-top: 1px solid var(--border); margin-top: 18px; padding-top: 14px; }
.rv-answer .lemma-line { margin: 0 0 6px; }
.rv-tr { color: var(--muted); font-size: .95rem; margin-top: 8px; }
.rv-rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 18px; }
.rv-rate .btn { flex-direction: column; gap: 1px; padding: 8px 6px; justify-content: center; }
.rv-rate small { font-weight: 400; font-size: .76rem; opacity: .8; }
.rv-rate .again { color: var(--danger); }
.rv-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 14px; font-size: .85rem; }
.kbd-hint { color: var(--muted); font-size: .78rem; text-align: center; margin-top: 12px; }
.rv-done { text-align: center; padding: 40px 16px; }
.rv-done h2 { font: 600 1.3rem var(--serif); margin-bottom: 6px; }
.rv-done .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }

/* summaries and the Anki dialog */
.summary-card .seg { margin: 4px 0 12px; }
.sum-text { font-size: .98rem; }
.sum-text[lang] { font-family: var(--serif); font-size: 1.05rem; }
.summary-card ul { margin: 10px 0 0; padding-left: 18px; }
.summary-card li { margin: 3px 0; }
.anki-body ol { padding-left: 20px; margin: 10px 0; }
.anki-body li { margin: 4px 0; }
.anki-body .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

@media (max-width: 560px) {
  .rv-card { padding: 18px 16px; }
  .rv-sentence { font-size: 1.18rem; }
  .kbd-hint { display: none; }
  .rv-rate { gap: 6px; }
}

@media (max-width: 960px) {
  .reader-body, .settings-grid { grid-template-columns: 1fr; }
  .panel { position: static; max-height: none; }
  .panel.open { position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 25; max-height: 55vh; overflow: auto;
    background: var(--bg); border-top: 1px solid var(--border); box-shadow: 0 -6px 24px rgba(0,0,0,.15); padding: 12px 12px 4px; }
  .panel.open .close-sheet { display: inline-block; }
  .text { padding: 20px 18px; font-size: 1.15rem; }
  .text .row { grid-template-columns: 1fr; gap: 4px; padding: 10px 16px; }
  .form-row { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .top-inner { gap: 10px; }
  .brand span:last-child { display: none; }
  main { padding-top: 16px; }
  .stat { min-width: 0; flex: 1 1 140px; }
  .vgrid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
  .vcard { min-height: 76px; padding: 8px 9px; }
  .cards { grid-template-columns: 1fr; }
}
/* Phones: an open word or phrase card takes the whole screen, with a Close
   bar that stays at the top while the card scrolls. */
@media (max-width: 700px) {
  .panel.open { top: 0; height: 100vh; height: 100dvh; max-height: none; z-index: 40; border-top: 0; box-shadow: none;
    padding: 0 12px calc(16px + env(safe-area-inset-bottom)); overscroll-behavior: contain; }
  .panel.open .sheet-bar { display: flex; position: sticky; top: 0; z-index: 1; justify-content: flex-end;
    margin: 0 -12px 8px; padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
    background: var(--bg); border-bottom: 1px solid var(--border); }
  .sheet-bar .btn { min-height: 40px; padding: 6px 16px; }
  .panel.open .close-sheet { display: none; }
  body.card-open { overflow: hidden; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="#/"><span class="mark">Aa</span><span>Language Reader</span></a>
    <nav>
      <a href="#/">Library</a>
      <a href="#/new">Paste text</a>
      <a href="#/review">Review<span class="count" id="review-count"></span></a>
      <a href="#/vocab">Vocabulary</a>
      <a href="#/phrases">Phrase book</a>
      <a href="#/settings">Settings</a>
    </nav>
  </div>
</header>
<main id="view"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
let MODELS = { default: "", models: [] };  // default model first, then stronger ones
const MODEL_NAMES = {
  "claude-haiku-5-5": "Haiku 5.5", "claude-sonnet-5-5": "Sonnet 5.5", "claude-opus-5-5": "Opus 5.5",
  "claude-sonnet-5": "Sonnet 5", "claude-opus-5": "Opus 5", "claude-fable-5-2": "Fable 5.2",
  "claude-haiku-4-5": "Haiku 4.5", "claude-sonnet-4-6": "Sonnet 4.6", "claude-opus-4-8": "Opus 4.8",
};
const modelLabel = (m) => MODEL_NAMES[m] || m;
let LANGS = {};      // languages being learned: code -> name (from Settings)
let LANG_NAMES = {};  // every language the app knows, for names of older data

function setLanguages(r) {
  LANGS = Object.fromEntries(r.configured.map((l) => [l.code, l.name]));
  LANG_NAMES = Object.fromEntries(r.available.map((l) => [l.code, l.name]));
}
const langName = (c) => LANGS[c] || LANG_NAMES[c] || c;
// Configured languages first, then any others that still have saved data.
function langsWithData(stats, extra = []) {
  const codes = Object.keys(LANGS);
  for (const c of [...Object.keys(stats || {}), ...extra]) if (!codes.includes(c)) codes.push(c);
  return codes;
}
function langHue(code) {
  let h = 0;
  for (const ch of code) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return { ru: 4, fi: 210 }[code] ?? h;
}
const langBadge = (code) => el("span", { class: "badge lang", style: `--h:${langHue(code)}` }, langName(code));
const STATUS_LABEL = { new: "New", learning: "Learning", known: "Known" };
const CEFR = ["A1", "A2", "B1", "B2", "C1", "C2"];
const view = document.getElementById("view");

// ------------------------------------------------------------------ utils
const pref = {
  get(k, d = "") { try { return localStorage.getItem("reader." + k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("reader." + k, v); } catch {} },
};
let TOKEN = pref.get("token");

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else if (["value", "checked", "selected", "disabled"].includes(k)) e[k] = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false && c !== "") e.append(c instanceof Node ? c : String(c));
  return e;
}
const $ = (s, root = document) => root.querySelector(s);

function toast(msg, kind = "") {
  const t = el("div", { class: kind }, msg);
  $("#toast").append(t);
  setTimeout(() => t.remove(), kind === "error" ? 6000 : 2600);
}

async function api(path, opts = {}) {
  const headers = {};
  if (opts.body !== undefined) headers["Content-Type"] = "application/json";
  if (TOKEN) headers.Authorization = "Bearer " + TOKEN;
  const r = await fetch(path, { method: opts.method || "GET", headers, body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined });
  if (r.status === 401) {
    const t = prompt("This Language Reader instance needs an access token:");
    if (t) { TOKEN = t.trim(); pref.set("token", TOKEN); return api(path, opts); }
    throw new Error("Unauthorized");
  }
  const ct = r.headers.get("content-type") || "";
  const data = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) {
    const err = new Error(typeof data === "object" ? (typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail)) : data || r.statusText);
    err.status = r.status;
    throw err;
  }
  return data;
}

const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

function fmtDate(s) {
  if (!s) return "";
  const d = new Date(s.replace(" ", "T") + "Z");
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
}

function errorCard(err) {
  return el("div", { class: "error-box" },
    el("b", {}, err.status === 502 ? "Backend error" : "Error"), " — ", err.message,
    err.status === 502 ? el("div", { class: "small", style: "margin-top:6px" }, el("a", { href: "#/settings" }, "Check the backend settings →")) : null);
}

function highlight(sentence, surface) {
  if (!sentence) return "";
  const i = surface ? sentence.indexOf(surface) : -1;
  if (i < 0) return sentence;
  return [sentence.slice(0, i), el("b", {}, surface), sentence.slice(i + surface.length)];
}

// ------------------------------------------------------------------ router
async function route() {
  const h = location.hash || "#/";
  for (const a of document.querySelectorAll("nav a")) {
    const href = a.getAttribute("href");
    a.classList.toggle("active", href === "#/" ? (h === "#/" || h === "#" || h.startsWith("#/text")) : h.startsWith(href));
  }
  hideSelBtn();
  R = null;
  reviewKeys = null;
  refreshReviewCount();
  view.replaceChildren(el("div", { class: "loading" }, "Loading…"));
  window.scrollTo(0, 0);
  try {
    let m;
    if (h === "#/" || h === "#") await viewLibrary();
    else if (h === "#/new") viewNew();
    else if ((m = h.match(/^#\/text\/(\d+)$/))) await viewText(+m[1]);
    else if (h.startsWith("#/vocab?") && new URLSearchParams(h.split("?")[1]).get("tab") === "phrases") location.hash = "#/phrases";
    else if (h.startsWith("#/vocab")) await viewVocab();
    else if (h.startsWith("#/review")) await viewReview();
    else if (h.startsWith("#/phrases")) await viewVocab({ phrasebook: true });
    else if (h === "#/settings") await viewSettings();
    else location.hash = "#/";
  } catch (e) {
    view.replaceChildren(errorCard(e));
  }
}
window.addEventListener("hashchange", route);

// ------------------------------------------------------------------ library
async function viewLibrary() {
  const [texts, stats] = await Promise.all([api("/api/texts"), api("/api/stats")]);
  const codes = langsWithData(stats, texts.map((t) => t.lang));
  let lang = pref.get("lib.lang");
  if (lang && !codes.includes(lang)) lang = "";
  const list = el("div");
  const seg = el("div", { class: "seg" });
  for (const [k, label] of [["", "All"], ...codes.map((c) => [c, langName(c)])]) {
    seg.append(el("button", { class: lang === k ? "on" : "", onclick: (e) => {
      lang = k; pref.set("lib.lang", k);
      seg.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === e.currentTarget));
      draw();
    } }, label));
  }
  const strip = el("div", { class: "stats-strip" });
  for (const k of codes) {
    const s = stats[k] || { total: 0, by_status: {}, by_cefr: {} };
    strip.append(el("div", { class: "stat" },
      el("div", { class: "muted small" }, langName(k)),
      el("div", { class: "n" }, s.total, el("span", { class: "muted small" }, " words")),
      el("div", { class: "muted small" }, `${plural(s.texts || 0, "text")} · ${plural(s.phrases || 0, "phrase")} · ${s.by_status.known || 0} known`)));
  }
  function draw() {
    const shown = lang ? texts.filter((t) => t.lang === lang) : texts;
    if (!shown.length) {
      list.replaceChildren(el("div", { class: "empty" },
        el("p", {}, texts.length ? "No texts in this language yet." : "Paste some text to start reading."),
        el("a", { class: "btn primary", href: "#/new" }, "Paste text")));
      return;
    }
    list.replaceChildren(el("div", { class: "cards" }, shown.map((t) =>
      el("a", { class: "text-card", href: `#/text/${t.id}` },
        langBadge(t.lang),
        el("h3", { lang: t.lang }, t.title),
        el("div", { class: "preview", lang: t.lang }, t.preview),
        el("div", { class: "meta" },
          [fmtDate(t.created_at), `${plural(t.words, "word")} looked up`, t.phrases ? plural(t.phrases, "phrase") : null,
           t.translated ? (t.translated === t.sentences ? "translated" : `${t.translated}/${t.sentences} translated`) : null]
            .filter(Boolean).join(" · "))))));
  }
  draw();
  view.replaceChildren(
    el("div", { class: "page-head" }, el("h1", {}, "Library"), el("div", { style: "display:flex;gap:8px;flex-wrap:wrap" }, seg, el("a", { class: "btn primary", href: "#/new" }, "+ Paste text"))),
    strip, list);
}

// ------------------------------------------------------------------ new text
function viewNew() {
  let lang = pref.get("new.lang", "auto");
  if (lang !== "auto" && !LANGS[lang]) lang = "auto";
  const seg = el("div", { class: "seg seg-wrap" });
  const hint = el("small", { class: "detect-hint" });
  for (const [k, name] of [["auto", "Auto-detect"], ...Object.entries(LANGS)]) {
    seg.append(el("button", { type: "button", class: lang === k ? "on" : "", onclick: (e) => {
      lang = k; pref.set("new.lang", k);
      seg.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === e.currentTarget));
      updateHint();
    } }, name));

// Minimal Markdown for model replies: escape first, then bold, italics, code,
// bullet/numbered lists and paragraphs.
function renderMarkdown(text) {
  const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  for (const line of text.split("\n")) {
    const m = line.match(/^\s*(?:[-*•]|(\d+)[.)])\s+(.*)$/);
    if (m) {
      const tag = m[1] ? "ol" : "ul";
      if (!list || list.tag !== tag) { if (list) out.push(`</${list.tag}>`); out.push(`<${tag}>`); list = { tag }; }
      out.push(`<li>${inline(m[2])}</li>`);

    if (line.trim()) out.push(`<p>${inline(line)}</p>`);

function applyMarks() {
  if (!R) return;
  const { body, surfaces, phrases } = R.t;
  for (const w of document.querySelectorAll("#text .w")) {
    const s = +w.dataset.s, e = +w.dataset.e;
    const o = R.occ.get(s + ":" + e);
    const sf = surfaces[body.slice(s, e).toLowerCase()];
    const st = o ? o.status : sf ? sf.status : null;
    w.className = "w" + (st ? " st-" + st : "")
      + (phrases.some((p) => p.kind !== "sentence" && s >= p.start && e <= p.end) ? " ph" : "")
      + (R.active && R.active.s === s && R.active.e === e ? " active" : "");
    w.title = sf ? `${sf.lemma} — ${sf.gloss || ""}` : "";
    const g = shortGloss((o && o.gloss_in_context) || (sf && sf.gloss));
    if (g) w.dataset.gloss = g; else delete w.dataset.gloss;
  }
}

// First meaning only, so it fits over the word: "to walk, stroll; to go out"
// -> "to walk". Bracketed asides go ("(is) opened" -> "opened", "in (our)
// library" -> "in library"); models often write them for Finnish passives
// and possessive suffixes.
function shortGloss(g) {
  const plain = (g || "").replace(/\([^)]*\)|\[[^\]]*\]/g, " ");
  return plain.split(/[;,]/).map((x) => x.replace(/\s+/g, " ").trim()).find(Boolean) || (g || "").trim();
}

// On phones the card is full screen, so the system Back gesture should close
// it rather than leave the text: opening it adds a history entry.
const fullCard = matchMedia("(max-width: 700px)");
const syncCardOpen = () => document.body.classList.toggle("card-open", fullCard.matches && !!$("#panel.open"));
fullCard.addEventListener("change", syncCardOpen);

function panelShow(node) {
  const p = $("#panel");
  if (!p) return;
  if (fullCard.matches && !p.classList.contains("open") && !history.state?.card) history.pushState({ card: true }, "");
  p.classList.add("open");
  const bar = el("div", { class: "sheet-bar" }, el("button", { type: "button", class: "btn", onclick: closeSheet }, "Close"));
  p.replaceChildren(bar, node);
  p.scrollTop = 0;
  syncCardOpen();
}

function dismissCard() {
  if (!$("#panel.open")) return;
  R.active = null; applyMarks(); renderPanelIdle();
}

function closeSheet() {
  if (history.state?.card) history.back(); // popstate closes it
  else dismissCard();
}
window.addEventListener("popstate", dismissCard);

const savedSentence = (sent) => R.t.phrases.find((p) => p.kind === "sentence" && p.start === sent.start && p.end === sent.end);

// Bookmark toggle that saves a sentence and its translation to the phrase book.
function starButton(sent, { label = false } = {}) {
  const b = el("button", { type: "button", class: "star" + (label ? " btn" : "") });
  const draw = () => {
    const on = !!savedSentence(sent);
    b.classList.toggle("on", on);
    b.title = on ? "Remove from phrase book" : "Save sentence to phrase book";
    b.setAttribute("aria-label", b.title);
    b.innerHTML = (on ? BOOKMARK_ON_SVG : BOOKMARK_SVG) + (label ? `<span>${on ? "In phrase book" : "Save to phrase book"}</span>` : "");
  };
  b.addEventListener("click", async (e) => {
    e.stopPropagation();
    b.disabled = true;
    try {
      const existing = savedSentence(sent);
      if (existing) {
        await api(`/api/phrases/${existing.id}`, { method: "DELETE" });
        R.t.phrases = R.t.phrases.filter((p) => p.id !== existing.id);
        toast("Removed from phrase book");
      } else {
        const r = await api(`/api/texts/${R.t.id}/sentences/${sent.id}/phrase`, { method: "POST" });
        R.t.phrases = [...R.t.phrases, spanIn(r)].sort((x, y) => x.start - y.start);
        if (sent.translation == null) { sent.translation = r.sentence_translation; updateTranslateBtn(); }
        toast("Saved to phrase book");
      }
      // Other stars for the same sentence (row and word card) follow.
      document.querySelectorAll(".star").forEach((x) => x._draw?.());
      if (!$("#panel.open")) renderPanelIdle();
      if (R.parallel) { const tr = b.closest(".tr"); if (tr && sent.translation) { tr.classList.remove("missing"); tr.firstChild.textContent = sent.translation; } }
    } catch (err) { toast(err.message, "error"); }
    b.disabled = false;
    draw();
  });
  b._draw = draw;
  draw();
  return b;
}

  if (!p) return;
  p.classList.remove("open");
  syncCardOpen();
  const help = el("div", { class: "card help" },
    el("h2", {}, "How to read"),
    el("p", {}, "Click a word to see its dictionary form, meaning in context and CEFR level. It is saved to your vocabulary."),
    el("p", {}, "Select several words to translate them as a phrase. It goes into your phrase book."),
    el("p", {}, "After translating the passage, use the bookmark beside any sentence in side-by-side view to save it to the phrase book too."),
    el("div", { class: "legend" },
      el("span", {}, el("span", { class: "sw", style: "background:var(--new-bg)" }), "new"),
      el("span", {}, el("span", { class: "sw", style: "background:var(--learning-bg)" }), "learning"),
      el("span", {}, el("span", { class: "sw", style: "border-bottom:2px solid var(--known-line)" }), "known"),
      el("span", {}, el("span", { class: "sw", style: "box-shadow:inset 0 -2px 0 var(--phrase-line)" }), "phrase in phrase book")));
  const phrases = R.t.phrases;
  const list = el("div", { class: "card" }, el("h2", {}, `Phrase book: from this text (${phrases.length})`),
    phrases.length
      ? el("ul", { class: "phrase-list" }, phrases.map((ph) => el("li", { onclick: () => renderPhraseCard(ph) },
          el("div", { class: "p-src", lang: R.t.lang }, ph.span, ph.kind === "sentence" ? el("span", { class: "muted small" }, " · sentence") : null), el("div", { class: "p-tr" }, ph.translation))))
      : el("div", { class: "muted small" }, "None yet."));
  list.append(el("div", { class: "small", style: "margin-top:8px" }, el("a", { href: "#/phrases" }, "Open the phrase book →")));
  const hasSummary = Object.keys(R.t.summaries || {}).length > 0;
  p.replaceChildren(...(hasSummary ? [summaryCard()] : []), help, list);
}

function sheetClose() {
  return el("button", { class: "icon close-sheet", title: "Close", onclick: closeSheet }, "✕");
}

function onWordClick(ev) {
  const w = ev.target.closest(".w");
  if (!w) return;
  const sel = getSelection();
  if (sel && !sel.isCollapsed && sel.toString().trim().length > 1) return;
  lookupWord(+w.dataset.s, +w.dataset.e);
}

// "Answered by X · Ask Y" row: re-run a lookup with a stronger configured model.
function escalateRow(answeredBy, onAsk, { label = true } = {}) {
  const others = MODELS.models.filter((m) => m !== answeredBy);
  if (!others.length) return null;
  return el("div", { class: "escalate" },
    answeredBy && label ? el("span", { class: "muted small" }, `Answered by ${modelLabel(answeredBy)}`) : null,
    others.map((m) => el("button", { type: "button", class: "btn esc-btn", title: `Ask ${m} instead`, onclick: () => onAsk(m) }, `Ask ${modelLabel(m)}`)));
}

async function lookupWord(s, e, refresh = false, model = null) {
  R.active = { s, e };
  applyMarks();
  const surface = R.t.body.slice(s, e);
  panelShow(el("div", { class: "card" }, el("div", { class: "surface", lang: R.t.lang }, surface), el("div", { class: "spinner" }, model ? `Asking ${modelLabel(model)}…` : "Looking up…")));
  try {
    const tid = R.t.id;
    const r = await api("/api/lookup", { method: "POST", body: { text_id: tid, start: R.cp.out(s), end: R.cp.out(e), refresh, model } });
    if (!R || R.t.id !== tid || !R.active || R.active.s !== s || R.active.e !== e) return; // superseded
    const L = r.lemma;
    R.occ.set(s + ":" + e, { start: s, end: e, lemma_id: L.id, status: L.status, surface, gloss_in_context: r.analysis?.gloss });
    R.t.surfaces[surface.toLowerCase()] = { lemma_id: L.id, lemma: L.stressed || L.lemma, status: L.status, gloss: L.gloss };
    applyMarks();
    renderWordCard(r);
  } catch (err) {
    if (R && R.active && R.active.s === s) panelShow(errorCard(err));
  }
}

function renderWordCard(r) {
  const a = r.analysis, L = r.lemma;
  panelShow(el("div", { class: "card word-card" },
    el("div", { class: "wc-top" },
      el("div", { class: "surface", lang: R.t.lang }, r.surface, speakButton(() => r.surface, R.t.lang, { label: "Listen to this form" })),
      el("div", {},
        favButton(L),
        el("button", { class: "icon", title: "Analyse again without the cache", onclick: () => lookupWord(R.active.s, R.active.e, true) }, "↻"),
        sheetClose())),
    el("div", { class: "lemma-line" },
      el("span", { class: "lemma", lang: R.t.lang }, L.stressed || L.lemma),
      speakButton(() => L.lemma, R.t.lang, { label: "Listen to the dictionary form" }),
      el("span", { class: "pos" }, L.pos),
      L.cefr ? el("span", { class: "cefr cefr-" + L.cefr[0], title: "CEFR · " + (L.cefr_source || "") }, L.cefr) : null),
    el("div", { class: "gloss" }, a.gloss),
    a.morphology ? el("div", { class: "morph" }, a.morphology) : null,
    a.compound_parts.length ? el("div", { class: "kv" }, el("span", { class: "k" }, "Compound"), a.compound_parts.join(" + ")) : null,
    a.other_meanings.length ? el("div", { class: "kv" }, el("span", { class: "k" }, "Also"), a.other_meanings.join("; ")) : null,
    a.notes ? el("div", { class: "notes" }, a.notes) : null,
    escalateRow(r.model, (m) => lookupWord(R.active.s, R.active.e, false, m)),
    statusButtons(L),
    sentenceBlock(r.sentence),
    chatBox("word", L.id, { textId: R.t.id, lang: R.t.lang }),
    el("div", { class: "card-foot" },
      el("a", { href: "#/vocab?q=" + encodeURIComponent(L.lemma) + "&lang=" + R.t.lang }, "In vocabulary →"),
      el("button", { class: "link danger", onclick: () => forgetLemma(L) }, "Remove word"))));
}

// Star toggle for a word (lemma). w needs id and starred; it is updated in place.
function favButton(w, onChange) {
  const b = el("button", { type: "button", class: "fav" });
  const draw = () => {
    b.classList.toggle("on", !!w.starred);
    b.title = w.starred ? "Remove star" : "Star this word";
    b.setAttribute("aria-label", b.title);
    b.setAttribute("aria-pressed", String(!!w.starred));
    b.innerHTML = w.starred ? STAR_ON_SVG : STAR_SVG;
  };
  b.addEventListener("click", async (e) => {
    e.stopPropagation();
    b.disabled = true;
    try {
      const r = await api(`/api/vocab/${w.id}`, { method: "PATCH", body: { starred: !w.starred } });
      w.starred = r.starred;
      draw();
      onChange?.(!!w.starred);
    } catch (err) { toast(err.message, "error"); }
    b.disabled = false;
  });
  draw();
  return b;
}

function statusButtons(L, onChange) {
  const wrap = el("div", { class: "seg status-seg" });
  for (const st of Object.keys(STATUS_LABEL)) {
    wrap.append(el("button", { class: `st-btn st-${st}` + (L.status === st ? " on" : ""), onclick: async () => {
      try {
        await setStatus(L.id, st);
        L.status = st;
        onChange?.(st);
        wrap.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.classList.contains("st-" + st)));
      } catch (err) { toast(err.message, "error"); }
    } }, STATUS_LABEL[st]));
  }
  return wrap;
}

async function setStatus(id, st) {
  await api(`/api/vocab/${id}`, { method: "PATCH", body: { status: st } });
  if (R) {
    for (const o of R.occ.values()) if (o.lemma_id === id) o.status = st;
    for (const v of Object.values(R.t.surfaces)) if (v.lemma_id === id) v.status = st;
    applyMarks();
  }
}

function sentenceBlock(sent) {
  const box = el("div", { class: "sent-box" }, el("div", { class: "k" }, "Sentence ",
    speakButton(() => sent.text, R.t.lang, { label: "Listen to the sentence" })));
  const tr = R.t.sentences.find((x) => x.id === sent.id)?.translation ?? sent.translation;
  if (tr) {
    const trEl = el("div", { class: "sent-tr" }, tr);
    box.append(trEl);
    const row = escalateRow(MODELS.default, async (m) => {
      row.querySelectorAll("button").forEach((b) => (b.disabled = true));
      trEl.textContent = `Asking ${modelLabel(m)}…`;
      try {
        await translateSentences([sent.id], m);
        trEl.textContent = R.t.sentences.find((x) => x.id === sent.id)?.translation || "";
      } catch (err) { toast(err.message, "error"); trEl.textContent = tr; }
      row.querySelectorAll("button").forEach((b) => (b.disabled = false));
    }, { label: false });
    if (row) { row.prepend(el("span", { class: "muted small" }, "Retranslate:")); box.append(row); }
  }
  else {
    const b = el("button", { class: "btn", style: "margin-top:6px", onclick: async () => {
      b.disabled = true; b.textContent = "Translating…";
      try {
        await translateSentences([sent.id]);
        b.replaceWith(el("div", { class: "sent-tr" }, R.t.sentences.find((x) => x.id === sent.id)?.translation || ""));
      } catch (err) { toast(err.message, "error"); b.disabled = false; b.textContent = "Translate sentence"; }
    } }, "Translate sentence");
    box.append(b);
  }
  const so = R.t.sentences.find((x) => x.id === sent.id);
  if (so) box.append(el("div", { style: "margin-top:8px" }, starButton(so, { label: true })));
  return box;
}

async function forgetLemma(L) {
  if (!confirm(`Remove “${L.lemma}” and all its saved examples from your vocabulary?`)) return;
  await api(`/api/vocab/${L.id}`, { method: "DELETE" });
  for (const [k, o] of R.occ) if (o.lemma_id === L.id) R.occ.delete(k);
  for (const [k, v] of Object.entries(R.t.surfaces)) if (v.lemma_id === L.id) delete R.t.surfaces[k];
  R.active = null;
  applyMarks();
  renderPanelIdle();
}

// phrase selection -------------------------------------------------------
let selBtn = null;
function hideSelBtn() { if (selBtn) { selBtn.remove(); selBtn = null; } }

function textNodeBound(node, last) {
  const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT,
    { acceptNode: (n) => (n.parentElement?.dataset.off != null ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP) });
  if (node.nodeType === 3) return node.parentElement?.dataset.off != null ? node : null;
  let n = walker.nextNode(), found = n;
  if (last) while (n) { found = n; n = walker.nextNode(); }
  return found;
}

function posOf(node, offset) {
  if (node.nodeType === 3) {
    const p = node.parentElement;
    return p?.dataset.off != null ? +p.dataset.off + offset : null;
  }
  const kids = node.childNodes;
  if (offset < kids.length) { const t = textNodeBound(kids[offset], false); if (t) return posOf(t, 0); }
  if (offset > 0) { const t = textNodeBound(kids[offset - 1], true); if (t) return posOf(t, t.length); }
  return null;
}

const COARSE = matchMedia("(pointer: coarse)").matches;

function onSelect() {
  setTimeout(() => {
    const art = $("#text");
    art?.classList.remove("selecting");
    const sel = getSelection();
    if (!R || !art || !sel || sel.isCollapsed || !sel.rangeCount) return hideSelBtn();
    const range = sel.getRangeAt(0);
    if (!art.contains(range.commonAncestorContainer)) return hideSelBtn();
    const s0 = posOf(range.startContainer, range.startOffset), e0 = posOf(range.endContainer, range.endOffset);
    if (s0 == null || e0 == null || e0 <= s0) return hideSelBtn();
    // Snap to whole words: what gets translated is exactly what is highlighted.
    const first = R.tokens.find(([, b]) => b > s0);
    const last = [...R.tokens].reverse().find(([a]) => a < e0);
    if (!first || !last || first[0] >= last[1]) return hideSelBtn();
    const s = first[0], e = last[1];
    const ws = art.querySelector(`.w[data-s="${s}"]`), we = art.querySelector(`.w[data-e="${e}"]`);
    if (ws && we && !COARSE) {
      // Rewriting the selection would fight the drag handles on touch screens.
      const snapped = document.createRange();
      snapped.setStart(ws.firstChild, 0);
      snapped.setEnd(we.firstChild, we.firstChild.length);
      sel.removeAllRanges();
      sel.addRange(snapped);
    }
    if (first === last) {
      // Part of one word selected (or a double-click): that word, whole, is a lookup.
      hideSelBtn();
      if (!(R.active && R.active.s === s && R.active.e === e)) lookupWord(s, e);
      return;
    }
    showSelBtn(sel.getRangeAt(0), s, e);
  }, 0);
}

function showSelBtn(range, s, e) {
  hideSelBtn();
  selBtn = el("div", { class: "sel-btn", onmousedown: (ev) => ev.preventDefault() },
    speakButton(() => R.t.body.slice(s, e), R.t.lang, { label: "Listen", cls: "btn" }),
    el("button", { type: "button", class: "btn primary", onclick: () => translatePhrase(s, e) }, "Translate phrase"));
  document.body.append(selBtn);
  // Sit above the first line of the selection, clear of the sticky header;
  // drop below the last line when there is no room above.
  const rects = [...range.getClientRects()].filter((r) => r.width > 0);
  if (!rects.length) rects.push(range.getBoundingClientRect());
  // Merge the per-element rects into the first and last visual lines.
  const line = (ref) => {
    const same = rects.filter((r) => Math.abs(r.top - ref.top) < ref.height / 2);
    const left = Math.min(...same.map((r) => r.left)), right = Math.max(...same.map((r) => r.right));
    return { top: Math.min(...same.map((r) => r.top)), bottom: Math.max(...same.map((r) => r.bottom)), left, width: right - left };
  };
  const top = line(rects[0]), bottom = line(rects[rects.length - 1]);
  const bw = selBtn.offsetWidth, bh = selBtn.offsetHeight, gap = 8;
  const header = ($(".top")?.offsetHeight || 0) + 4;
  const above = top.top - bh - gap >= header;
  const y = above ? top.top - bh - gap : bottom.bottom + gap;
  const anchor = above ? top : bottom;
  const x = Math.max(8, Math.min(anchor.left + anchor.width / 2 - bw / 2, document.documentElement.clientWidth - bw - 8));
  selBtn.style.top = `${y + window.scrollY}px`;
  selBtn.style.left = `${x + window.scrollX}px`;
}

// The whole words a selection would snap to: [start, end] offsets, or null.
function snappedRange() {
  const sel = getSelection(), art = $("#text");
  if (!R || !art || !sel || sel.isCollapsed || !sel.rangeCount) return null;
  const range = sel.getRangeAt(0);
  if (!art.contains(range.commonAncestorContainer)) return null;
  const s0 = posOf(range.startContainer, range.startOffset), e0 = posOf(range.endContainer, range.endOffset);
  if (s0 == null || e0 == null || e0 <= s0) return null;
  const first = R.tokens.find(([, b]) => b > s0);
  const last = [...R.tokens].reverse().find(([a]) => a < e0);
  return first && last && first[0] < last[1] ? [first[0], last[1]] : null;
}

function clearLive() {
  document.querySelectorAll("#text .sel-live").forEach((x) => x.classList.remove("sel-live"));
  $("#text")?.classList.remove("has-live");
}

// While the mouse is down, show the whole words the selection covers.
let dragging = false, liveFrame = 0;
function liveSelect() {
  liveFrame = 0;
  const art = $("#text");
  if (!dragging || !art) return;
  const r = snappedRange();
  art.classList.toggle("has-live", !!r);
  for (const x of art.querySelectorAll(".w, .g")) {
    const off = +x.dataset.off, end = off + x.textContent.length;
    // Words that overlap the range; gaps only when they lie between two such words.
    const on = !!r && (x.classList.contains("w") ? off < r[1] && end > r[0] : off >= r[0] && end <= r[1]);
    x.classList.toggle("sel-live", on);
  }
}

document.addEventListener("mousedown", (e) => {
  if (selBtn && !selBtn.contains(e.target)) hideSelBtn();
  const art = e.target.closest?.("#text");
  clearLive();
  // Suppress word hover boxes while dragging out a selection.
  if (art && e.button === 0) { art.classList.add("selecting"); dragging = true; }
});
document.addEventListener("selectionchange", () => {
  if (dragging && !liveFrame) liveFrame = requestAnimationFrame(liveSelect);
});
document.addEventListener("mouseup", () => {
  dragging = false;
  clearLive();
  $("#text")?.classList.remove("selecting");
});
if (COARSE) {
  // Touch selections are adjusted with drag handles and fire no mouseup on the text.
  let t;
  document.addEventListener("selectionchange", () => { clearTimeout(t); t = setTimeout(onSelect, 400); });
}

async function translatePhrase(s, e, model = null) {
  hideSelBtn();
  getSelection().removeAllRanges();
  R.active = null;
  applyMarks();
  const span = R.t.body.slice(s, e);
  panelShow(el("div", { class: "card" }, el("div", { class: "k" }, "Phrase"), el("div", { class: "phrase-src", lang: R.t.lang }, span), el("div", { class: "spinner" }, model ? `Asking ${modelLabel(model)}…` : "Translating…")));
  try {
    const p = spanIn(await api("/api/phrases", { method: "POST", body: { text_id: R.t.id, start: R.cp.out(s), end: R.cp.out(e), model } }));
    R.t.phrases = R.t.phrases.filter((x) => x.id !== p.id).concat(p).sort((a, b) => a.start - b.start);
    applyMarks();
    renderPhraseCard(p);
  } catch (err) { panelShow(errorCard(err)); }
}

function renderPhraseCard(p) {
  panelShow(el("div", { class: "card phrase-card" },
    el("div", { class: "wc-top" }, el("div", { class: "k" }, p.kind === "sentence" ? "Phrase book · sentence" : "Phrase book"), sheetClose()),
    el("div", { class: "phrase-src", lang: R.t.lang }, p.span, " ", speakButton(() => p.span, R.t.lang)),
    el("div", { class: "gloss" }, p.translation),
    p.literal ? el("div", { class: "kv" }, el("span", { class: "k" }, "Literally"), p.literal) : null,
    p.notes ? el("div", { class: "notes" }, p.notes) : null,
    p.kind === "sentence" ? null : escalateRow(p.model, (m) => translatePhrase(p.start, p.end, m)),
    chatBox("phrase", p.id, { lang: R.t.lang }),
    el("div", { class: "card-foot" },
      el("button", { class: "link", onclick: renderPanelIdle }, "← Phrase book"),
      el("button", { class: "link danger", onclick: async () => {
        await api(`/api/phrases/${p.id}`, { method: "DELETE" });
        R.t.phrases = R.t.phrases.filter((x) => x.id !== p.id);
        document.querySelectorAll(".star").forEach((x) => x._draw?.());
        applyMarks(); renderPanelIdle();
      } }, "Remove from phrase book"))));
}

// ------------------------------------------------------------------ vocabulary
async function viewVocab({ phrasebook = false } = {}) {
  const params = new URLSearchParams(location.hash.split("?")[1] || "");
  const st = {
    tab: phrasebook ? "phrases" : "words", lang: params.get("lang") ?? pref.get("vocab.lang"), status: "", cefr: "", q: params.get("q") || "",
    layout: pref.get("vocab.layout", "grid"), group: pref.get("vocab.group", "alpha"),

  function drawStats() {

  const cefrSel = sel([["", "Any level"], ...CEFR.map((c) => [c, c]), ["none", "No level"]], "", (e) => { st.cefr = e.target.value; load(); });

  } });
  const exportLink = el("a", { class: "btn" }, "Export CSV");
  const starBtn = el("button", { type: "button", class: "btn star-filter" + (st.starred ? " on" : ""), "aria-pressed": String(st.starred), onclick: () => {
    st.starred = !st.starred;
    starBtn.classList.toggle("on", st.starred); starBtn.setAttribute("aria-pressed", String(st.starred));
    starBtn.innerHTML = (st.starred ? STAR_ON_SVG : STAR_SVG) + "<span>Starred</span>";
    load();
  } });
  starBtn.innerHTML = (st.starred ? STAR_ON_SVG : STAR_SVG) + "<span>Starred</span>";
  const ankiBtn = el("button", { type: "button", class: "btn", onclick: () => {
    const q = new URLSearchParams();
    if (st.lang) q.set("lang", st.lang);
    if (st.tab === "words") {
      if (st.status) q.set("status", st.status);
      if (st.cefr) q.set("cefr", st.cefr);
      if (st.starred) q.set("starred", "true");

  const layoutSeg = el("div", { class: "seg" });
  for (const [k, l] of [["grid", "Grid"], ["table", "Table"]]) {
    layoutSeg.append(el("button", { class: st.layout === k ? "on" : "", onclick: (e) => {

    } }, l));
  }
  const groupSel = sel([["alpha", "Alphabetical"], ["cefr", "By CEFR level"], ["status", "By status"], ["pos", "By part of speech"]], st.group,
    (e) => { st.group = e.target.value; pref.set("vocab.group", st.group); drawWords(lastRows); });
  groupSel.setAttribute("aria-label", "Group cards");
  function syncControls() {
    const words = st.tab === "words";
    statusSel.style.display = cefrSel.style.display = exportLink.style.display = layoutSeg.style.display = starBtn.style.display = words ? "" : "none";
    groupSel.style.display = words && st.layout === "grid" ? "" : "none";
  }
  const search_ph = phrasebook ? "Search phrases or translations" : "Search word, form or meaning";
  search.placeholder = search_ph;

  async function load() {
    const qs = new URLSearchParams();
    if (st.lang) qs.set("lang", st.lang);
    if (st.q) qs.set("q", st.q);
    results.replaceChildren(el("div", { class: "loading" }, "Loading…"));
    try {
      if (st.tab === "phrases") return drawPhrases(await api("/api/phrases?" + qs));
      if (st.status) qs.set("status", st.status);
      if (st.cefr) qs.set("cefr", st.cefr);

      if (TOKEN) ex.set("token", TOKEN);
      exportLink.href = "/api/export.csv?" + ex;
      drawWords(await api("/api/vocab?" + qs));
    } catch (err) { results.replaceChildren(errorCard(err)); }
  }

  function drawWords(rows) {
    lastRows = rows;
    if (!rows.length) {
      results.replaceChildren(el("div", { class: "empty" }, el("p", {}, st.starred && !st.q && !st.status && !st.cefr
        ? "No starred words yet. Use the star on a word card to add one."
        : st.q || st.status || st.cefr || st.starred ? "No words match these filters." : "No words yet. Click words while reading to collect them.")));
      return;
    }
    if (st.layout === "grid") return drawGrid(rows);
    const tbody = el("tbody");
    for (const w of rows) {
      const tr = el("tr", { class: "word-row" },
        el("td", {}, el("div", { class: "lemma-cell", lang: w.lang }, w.stressed || w.lemma), el("div", { class: "muted small" }, [langName(w.lang), w.pos].filter(Boolean).join(" · "))),
        el("td", {}, el("div", {}, w.gloss || "—"), w.example ? el("div", { class: "ex", lang: w.lang }, highlight(w.example, w.example_surface)) : null),
        el("td", {}, sel([["", "—"], ...CEFR.map((c) => [c, c])], w.cefr || "", async (e) => {
          try { await api(`/api/vocab/${w.id}`, { method: "PATCH", body: { cefr: e.target.value } }); toast("Level updated"); } catch (err) { toast(err.message, "error"); }
        })),
        el("td", {}, sel(Object.entries(STATUS_LABEL), w.status, async (e) => {
          try { await setStatus(w.id, e.target.value); } catch (err) { toast(err.message, "error"); }

        el("td", { style: "white-space:nowrap" }, favButton(w), el("button", { class: "icon", title: "Delete", onclick: async (e) => {
          e.stopPropagation();

        } }, "✕")));
      tr.addEventListener("click", async (e) => {
        if (e.target.closest("select,button,a")) return;
        const next = tr.nextElementSibling;
        if (next?.classList.contains("detail")) return next.remove();
        const cell = el("td", { colspan: 6 }, el("div", { class: "spinner" }, "Loading…"));
        tr.after(el("tr", { class: "detail" }, cell));
        try {
          cell.replaceChildren(...wordDetails(await api(`/api/vocab/${w.id}`)));
        } catch (err) { cell.replaceChildren(errorCard(err)); }
      });
      tbody.append(tr);
    }
    results.replaceChildren(
      el("div", { class: "muted small", style: "margin-bottom:8px" }, `${rows.length} words`),
      el("div", { class: "table-wrap" }, el("table", {},
        el("thead", {}, el("tr", {}, ["Word", "Meaning & first example", "CEFR", "Status", "Seen", ""].map((h) => el("th", {}, h)))),
        tbody)));
  }

  // Grid: word cards in labelled sections, A–Ö by default -----------------
  function groupRows(rows, lang) {
    const coll = new Intl.Collator(lang || undefined, { sensitivity: "base" });
    const key = (w) => stripStress(w.lemma);
    const sorted = [...rows].sort((a, b) => coll.compare(key(a), key(b)));
    if (st.group === "cefr") {
      return [...CEFR, ""].map((c) => [c || "No level", sorted.filter((w) => (w.cefr || "") === c)]).filter(([, l]) => l.length);
    }
    if (st.group === "status") {
      return Object.entries(STATUS_LABEL).map(([k, l]) => [l, sorted.filter((w) => w.status === k)]).filter(([, l]) => l.length);
    }
    const map = new Map();
    for (const w of sorted) {
      const k = st.group === "pos" ? (w.pos || "other") : (key(w).charAt(0).toLocaleUpperCase(lang || undefined) || "#");
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(w);
    }
    return [...map.entries()].sort((a, b) => coll.compare(a[0], b[0]));
  }

  function card(w) {
    const c = el("button", { type: "button", class: `vcard st-${w.status}`, onclick: () => openWord(w, c) },
      el("div", { class: "vc-top" },
        el("span", { class: "vc-word", lang: w.lang }, w.stressed || w.lemma,
          w.starred ? Object.assign(el("span", { class: "vc-star", title: "Starred" }), { innerHTML: STAR_ON_SVG }) : null),
        w.cefr ? el("span", { class: "cefr cefr-" + w.cefr[0] }, w.cefr) : null),
      el("div", { class: "vc-gloss" }, w.gloss || "—"),
      el("div", { class: "vc-meta" }, [w.pos, w.occurrences > 1 ? `seen ${w.occurrences}×` : null].filter(Boolean).join(" · ")));
    return c;
  }

  function drawGrid(rows) {
    const byLang = new Map();
    for (const code of langsWithData(stats, rows.map((w) => w.lang))) {
      const list = rows.filter((w) => w.lang === code);
      if (list.length) byLang.set(code, list);
    }
    const multi = byLang.size > 1;
    const out = [
      el("div", { class: "grid-head" },
        el("span", { class: "muted small" }, `${rows.length} words`),
        el("span", { class: "legend small" }, Object.entries(STATUS_LABEL).map(([k, l]) =>
          el("span", {}, el("span", { class: `sw st-${k}` }), l)))),
    ];
    let n = 0;
    for (const [code, list] of byLang) {
      const sections = groupRows(list, code);
      const ids = sections.map(() => `vsec-${n++}`);
      if (multi) out.push(el("h2", { class: "lang-h" }, langBadge(code), ` ${list.length} words`));
      if (sections.length > 1) {
        out.push(el("nav", { class: "letter-index", "aria-label": `Jump to section (${langName(code)})` },
          sections.map(([label], i) => el("a", { href: "#", onclick: (e) => {
            e.preventDefault();

          } }, label))));
      }
      sections.forEach(([label, items], i) => out.push(el("section", { class: "vsec", id: ids[i] },
        el("h3", { class: "vsec-h", lang: st.group === "alpha" ? code : null }, label, el("span", { class: "n" }, items.length)),
        el("div", { class: "vgrid" }, items.map(card)))));
    }
    results.replaceChildren(...out);
  }

  async function openWord(w, cardEl) {

    const dlg = el("dialog", { class: "word-dialog", onclose: () => dlg.remove() }, body);
    dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); }); // backdrop

    try {

        el("div", { class: "wc-top" },
          el("div", {}, langBadge(d.lang)),
          el("div", {},
            favButton(d, (on) => {

              else refreshCard();
            }),
            el("button", { class: "icon", title: "Close", onclick: () => dlg.close() }, "✕"))),
        el("div", { class: "lemma-line" },
          el("span", { class: "lemma", lang: d.lang }, d.stressed || d.lemma),
          speakButton(() => d.lemma, d.lang),
          el("span", { class: "pos" }, d.pos)),

        el("div", { class: "kv", style: "margin-top:10px" }, el("span", { class: "k" }, "CEFR"),
          sel([["", "—"], ...CEFR.map((c) => [c, c])], d.cefr || "", async (e) => {
            try {
              await api(`/api/vocab/${w.id}`, { method: "PATCH", body: { cefr: e.target.value } });
              w.cefr = e.target.value || null; refreshCard(); toast("Level updated");
            } catch (err) { toast(err.message, "error"); }
          }),
          d.cefr_source ? el("span", { class: "muted small" }, ` ${d.cefr_source}`) : null),
        ...wordDetails(d, { meta: false }),

          el("span", { class: "muted small" }, `Added ${fmtDate(d.created_at)}`),
          el("button", { class: "link danger", onclick: async () => {

  }

  function drawPhrases(rows) {
    if (!rows.length) {

      el("div", { class: "pb-grid" }, rows.map((p) => {

const stripStress = (s) => (s || "").replace(/[́̀]/g, "");

// Meanings, notes and every sentence a word was met in.
function wordDetails(d, { meta = true } = {}) {
  return [
    d.other_meanings.length ? el("div", { class: "kv" }, el("b", {}, "Also: "), d.other_meanings.join("; ")) : null,

    el("div", { class: "occ-list" },
      el("div", { class: "k" }, d.occurrences.length === 1 ? "Seen once" : `Seen ${d.occurrences.length} times`),
      d.occurrences.map((o) => el("div", { class: "occ" },
        el("div", { class: "s", lang: d.lang }, highlight(o.sentence_text, o.surface)),
        o.sentence_translation ? el("div", { class: "muted small" }, o.sentence_translation) : null,
        el("div", { class: "muted small" },
          [o.surface, o.morphology, o.gloss_in_context].filter(Boolean).join(" · "),
          o.text_id ? [" · ", el("a", { href: `#/text/${o.text_id}` }, o.text_title || "open text")] : " · text deleted")))),
  ].filter(Boolean);
}
