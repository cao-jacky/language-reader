      const pin = el("input", { type: "text", inputmode: "decimal", class: "price-input", value: p ? String(p.in) : "", placeholder: "—", "aria-label": `${model} input price` });
      const pout = el("input", { type: "text", inputmode: "decimal", class: "price-input", value: p ? String(p.out) : "", placeholder: "—", "aria-label": `${model} output price` });
      inputs.push([model, pin, pout]);
      return el("tr", {}, el("td", {}, modelLabel(model), model !== modelLabel(model) ? el("div", { class: "muted small" }, model) : null),
        el("td", {}, pin), el("td", {}, pout), el("td", { class: "muted small" }, p ? p.source : "not set"));
    });
    const savePrices = el("button", { type: "button", class: "btn", onclick: async () => {
      let saved = {};
      try { saved = JSON.parse(S.llm_prices || "{}"); } catch {}
      for (const [model, pin, pout] of inputs) {
        if (pin.value.trim() === "" && pout.value.trim() === "") { delete saved[model]; continue; }
        saved[model] = { in: Number(pin.value), out: Number(pout.value) };
      }
      try {
        const r = await api("/api/settings", { method: "PUT", body: { values: { llm_prices: JSON.stringify(saved) } } });
        S = r.settings; toast("Prices saved; they apply to new requests"); loadUsage();
      } catch (err) { toast(err.message, "error"); }
    } }, "Save prices");
    parts.push(el("div", { class: "k", style: "margin-top:18px" }, "Prices (USD per million tokens)"),
      el("div", { class: "table-wrap", style: "margin-top:6px" }, el("table", {},
        el("thead", {}, el("tr", {}, ["Model", "Input", "Output", ""].map((h) => el("th", {}, h)))), el("tbody", {}, rows))),
      el("div", { style: "margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap" }, savePrices,
        el("span", { class: "muted small" }, "Anthropic list prices are filled in. Set 0 for a local model, or your provider's prices for others.")));
    usageBox.replaceChildren(...parts);
  }
  loadUsage();

  view.replaceChildren(el("div", { class: "page-head" }, el("h1", {}, "Settings")), el("div", { class: "settings-grid" }, el("div", {}, langCard, form, speechCard, usageCard), side));
  fill();
}

// ------------------------------------------------------------------ Anki export
function ankiDialog(what, params, count) {
  let notetype = pref.get("anki.notetype", "cloze");
  const link = el("a", { class: "btn primary", download: "" }, "Download");
  const desc = el("p", { class: "muted small" });
  const DESC = {
    words: {
      cloze: "Anki's Cloze type: each word's example sentence with the word hidden and its meaning as the hint. On the back: the dictionary form, meaning and sentence translation.",
      basic: "Anki's Basic type: the word in its example sentence on the front; the dictionary form, meaning and sentence translation on the back.",
    },
    phrases: {
      cloze: "Anki's Cloze type: each phrase hidden in the sentence it came from, with its translation as the hint.",
      basic: "Anki's Basic type: the phrase on the front, its translation on the back.",
    },
  };
  const update = () => {
    const q = new URLSearchParams(params);
    q.set("what", what); q.set("notetype", notetype);
    if (TOKEN) q.set("token", TOKEN);
    link.href = "/api/export/anki.txt?" + q;
    desc.textContent = DESC[what][notetype];
  };
  const seg = el("div", { class: "seg", role: "group", "aria-label": "Card type" });
  for (const [k, l] of [["cloze", "Fill in the blank"], ["basic", "Front and back"]]) {
    seg.append(el("button", { type: "button", class: notetype === k ? "on" : "", onclick: (e) => {
      notetype = k; pref.set("anki.notetype", k);
      seg.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === e.currentTarget));
      update();
    } }, l));
  }
  const lang = params.get("lang");
  const deck = "Language Reader" + (lang ? "::" + langName(lang) : "");
  const filters = [lang ? langName(lang) : "all languages", params.get("status") && STATUS_LABEL[params.get("status")].toLowerCase(),
    params.get("cefr") && (params.get("cefr") === "none" ? "no level" : params.get("cefr")), params.get("starred") && "starred only"].filter(Boolean);
  const dlg = el("dialog", { class: "word-dialog", onclose: () => dlg.remove() },
    el("div", { class: "wd-body anki-body" },
      el("div", { class: "wc-top" }, el("h2", { style: "margin:0" }, what === "words" ? "Export words to Anki" : "Export phrases to Anki"),
        el("button", { class: "icon", title: "Close", onclick: () => dlg.close() }, "✕")),
      el("p", { class: "small" }, (count != null ? `${plural(count, "word")}, ` : "") + "using the current filters: " + filters.join(", ") + "."),
      seg, desc,
      el("ol", { class: "small" },
        el("li", {}, "Download the file."),
        el("li", {}, "In Anki, choose File → Import and pick it. The note type and the deck ", el("b", {}, deck), " are set by the file."),
        el("li", {}, "Exporting and importing again later updates the same notes instead of adding duplicates.")),
      el("div", { class: "row" }, el("button", { class: "btn", onclick: () => dlg.close() }, "Close"), link)));
  dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
  update();
  document.body.append(dlg);
  dlg.showModal();
}

// ------------------------------------------------------------------ summaries
function summaryCard() {
  const target = MODELS.target_language || "your language";
  let kind = pref.get("summary.kind", "target");
  const body = el("div");
  const seg = el("div", { class: "seg", role: "group", "aria-label": "Summary language" });
  for (const [k, l] of [["target", `In ${target}`], ["simple", `Simple ${langName(R.t.lang)}`]]) {
    seg.append(el("button", { type: "button", class: kind === k ? "on" : "", onclick: (e) => {
      kind = k; pref.set("summary.kind", k);
      seg.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === e.currentTarget));
      draw();
    } }, l));
  }
  const tid = R.t.id;
  function draw() {
    const s = (R.t.summaries || {})[kind];
    if (!s) {
      body.replaceChildren(
        el("p", { class: "muted small" }, kind === "simple"
          ? `A few short sentences in plain ${langName(R.t.lang)}, as reading practice before the full text.`
          : `What the text says, in a few sentences of ${target}.`),
        el("button", { class: "btn primary", onclick: () => make() }, "Summarise"));
      return;
    }
    const tl = kind === "simple" ? R.t.lang : null;
    body.replaceChildren(...[
      el("div", { class: "sum-text", lang: tl }, s.summary, " ", tl ? speakButton(() => s.summary, tl, { label: "Listen to the summary" }) : null),
      s.key_points.length ? el("ul", { lang: tl }, s.key_points.map((x) => el("li", {}, x))) : null,
      escalateRow(s.model, (m) => make(m)),
    ].filter(Boolean));
  }
  async function make(model = null) {
    body.replaceChildren(el("div", { class: "spinner" }, model ? `Asking ${modelLabel(model)}…` : "Summarising…"));
    try {
      const r = await api(`/api/texts/${tid}/summary`, { method: "POST", body: { kind, model } });
      if (!R || R.t.id !== tid) return;
      (R.t.summaries ||= {})[kind] = r;
    } catch (err) { toast(err.message, "error"); }
    draw();
  }
  draw();
  return el("div", { class: "card summary-card" },
    el("div", { class: "wc-top" }, el("h2", { style: "margin:0" }, "Summary"), sheetClose()),
    seg, body);
}

// ------------------------------------------------------------------ review
let reviewKeys = null;  // keyboard handler of the open review page
document.addEventListener("keydown", (e) => reviewKeys?.(e));

async function refreshReviewCount() {
  const badge = $("#review-count");
  if (!badge) return;
  // The new-word limit is per language, as on the Review page.
  const limit = Number(pref.get("review.perDay", "20")) || 20;
  try {
    const rs = await Promise.all(Object.keys(LANGS).map((c) => api(`/api/review?count_only=true&lang=${c}&new_limit=${limit}`)));
    const due = rs.reduce((n, r) => n + r.due, 0), fresh = rs.reduce((n, r) => n + Math.min(r.new_left, r.new_total), 0);
    const n = due + fresh;
    badge.textContent = n ? (n > 99 ? "99+" : String(n)) : "";
    badge.title = n ? `${plural(due, "review")} due, ${plural(fresh, "new word")} to learn today` : "";
  } catch { badge.textContent = ""; }
}

function relTime(ts) {
  const ms = new Date(ts.replace(" ", "T") + "Z") - Date.now();
  const min = Math.round(ms / 60000);
  if (min < 1) return "in a moment";
  if (min < 60) return `in ${plural(min, "minute")}`;
  const h = Math.round(min / 60);
  if (h < 24) return `in ${plural(h, "hour")}`;
  return `in ${plural(Math.round(h / 24), "day")}`;
}

const normWord = (s) => stripStress(s || "").normalize("NFC").toLocaleLowerCase().replace(/[^\p{L}\p{M}\p{N}'’:-]/gu, "");

async function viewReview() {
  const stats = await api("/api/stats");
  const codes = langsWithData(stats);
  const rv = {
    lang: pref.get("review.lang", codes[0] || ""), starred: pref.get("review.starred") === "1",
    mode: pref.get("review.mode", "recognise"), perDay: Number(pref.get("review.perDay", "20")) || 20, extra: 0,
  };
  if (rv.lang && !codes.includes(rv.lang)) rv.lang = codes[0] || "";
  let info = null, queue = [], total = 0, done = 0, cur = null, revealed = false, busy = false, newInBatch = 0;
  let ui = {};
  const stage = el("div", { class: "rv-stage" });
  const barFill = el("div");
  const meta = el("div", { class: "rv-meta" });

  const langSel = el("select", { "aria-label": "Language", onchange: (e) => { rv.lang = e.target.value; pref.set("review.lang", rv.lang); rv.extra = 0; load(); } },
    codes.map((c) => el("option", { value: c, selected: c === rv.lang }, langName(c))));
  const modeSeg = el("div", { class: "seg", role: "group", "aria-label": "Direction" });
  for (const [k, l, title] of [["recognise", "Word → meaning", "See the word in its sentence, recall what it means"],
                               ["recall", "Meaning → word", "See the sentence with a gap and the meaning, recall the word"]]) {
    modeSeg.append(el("button", { type: "button", title, class: rv.mode === k ? "on" : "", onclick: (e) => {
      rv.mode = k; pref.set("review.mode", k);
      modeSeg.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === e.currentTarget));
      if (cur) drawCard();
    } }, l));
  }
  const starBtn = el("button", { type: "button", class: "btn star-filter" + (rv.starred ? " on" : ""), "aria-pressed": String(rv.starred), onclick: () => {
    rv.starred = !rv.starred; pref.set("review.starred", rv.starred ? "1" : "0");
    starBtn.classList.toggle("on", rv.starred); starBtn.setAttribute("aria-pressed", String(rv.starred));
    starBtn.innerHTML = (rv.starred ? STAR_ON_SVG : STAR_SVG) + "<span>Starred only</span>";
    load();
  } });
  starBtn.innerHTML = (rv.starred ? STAR_ON_SVG : STAR_SVG) + "<span>Starred only</span>";
  const perDay = el("input", { type: "number", min: "0", max: "200", value: String(rv.perDay), onchange: (e) => {
    rv.perDay = Math.max(0, Math.min(200, Number(e.target.value) || 0)); e.target.value = rv.perDay;
    pref.set("review.perDay", String(rv.perDay)); load();
  } });

  async function load() {
    stage.replaceChildren(el("div", { class: "loading" }, "Loading…"));
    const q = new URLSearchParams({ new_limit: String(rv.perDay + rv.extra) });
    if (rv.lang) q.set("lang", rv.lang);
    if (rv.starred) q.set("starred", "true");
    try { info = await api("/api/review?" + q); }
    catch (err) { stage.replaceChildren(errorCard(err)); return; }
    queue = info.cards.slice(); total = queue.length; done = 0;
    newInBatch = queue.filter((c) => c.new).length;
    next();
  }

  function progress() {
    barFill.style.width = total ? `${(100 * done) / total}%` : "0";
    const due = queue.filter((c) => !c.new).length + (cur && !cur.new ? 1 : 0);
    const fresh = queue.filter((c) => c.new).length + (cur && cur.new ? 1 : 0);
    meta.replaceChildren(el("span", {}, cur ? `${plural(due, "review")} · ${plural(fresh, "new word")} left` : ""),
      el("span", {}, `Reviewed today: ${info.reviewed_today + done}`));
  }

  function next() {
    revealed = false; busy = false;
    cur = queue.shift() || null;
    progress();
    if (!cur) return finished();
    drawCard();
  }

  function finished() {
    const moreNew = info.new_total - newInBatch;
    if (!total && !info.due && !info.new_total) {
      stage.replaceChildren(el("div", { class: "empty" },
        el("p", {}, rv.starred ? "No starred words to review in this language." : "No words to review yet. Click words while reading; each one becomes a card here."),
        el("a", { class: "btn", href: "#/" }, "Go to the library")));
      return;
    }
    stage.replaceChildren(el("div", { class: "rv-done rv-card" },
      el("h2", {}, total ? "Done for now" : "Nothing due right now"),
      el("p", { class: "muted" }, info.next_due ? `The next review is due ${relTime(info.next_due)}.` : "No reviews are scheduled yet."),
      moreNew > 0 ? el("p", { class: "muted small" }, `${plural(moreNew, "new word")} still waiting. You've introduced ${info.new_today + newInBatch} today.`) : null,
      el("div", { class: "row" },
        moreNew > 0 ? el("button", { class: "btn primary", onclick: () => { rv.extra += 10; load(); } }, `Learn ${Math.min(10, moreNew)} more`) : null,
        el("a", { class: "btn", href: "#/" }, "Back to reading"))));
    refreshReviewCount();
  }

  function sentence(c, gap) {
    const ex = c.example;
    if (!ex || !ex.word) return null;
    // The hidden word is only added on reveal, so it can't be selected or read out early.
    ui.gap = gap ? el("span", { class: "rv-gap", style: `min-width:${Math.max(2.5, ex.word.length * 0.62)}em`, "aria-label": "missing word" }, "\u00a0") : null;
    return el("div", { class: "rv-sentence", lang: c.lang }, ex.before, gap ? ui.gap : el("span", { class: "rv-word" }, ex.word), ex.after);
  }

  function drawCard() {
    const c = cur, ex = c.example, recall = rv.mode === "recall";
    ui = {};
    const front = [];
    if (recall) {
      const hint = (ex && ex.gloss_in_context) || c.gloss || "—";
      const s = sentence(c, true);
      if (s) front.push(s, el("div", { class: "rv-hint" }, "Meaning here: ", el("b", {}, hint)));
      else front.push(el("div", { class: "rv-lemma-q" }, hint), el("div", { class: "rv-hint" }, `Which ${langName(c.lang)} word is this?`));
      ui.input = el("input", { type: "text", placeholder: "Type the word (optional)", autocomplete: "off", autocapitalize: "off", spellcheck: "false", lang: c.lang,
        "aria-label": "Your answer", onkeydown: (e) => { if (e.key === "Enter") { e.preventDefault(); reveal(); } } });
      front.push(el("div", { class: "rv-input" }, ui.input));
    } else {
      const s = sentence(c, false);
      front.push(s || el("div", { class: "rv-lemma-q", lang: c.lang }, c.stressed || c.lemma));
      front.push(el("div", { class: "rv-hint" }, speakButton(() => (ex && ex.word ? ex.before + ex.word + ex.after : c.lemma), c.lang, { label: "Listen" }),
        " What does ", el("b", { lang: c.lang }, ex && ex.word ? ex.word : c.stressed || c.lemma), " mean here?"));
    }
    ui.answer = el("div", { class: "rv-answer-slot" });
    ui.show = el("div", { class: "rv-show" }, el("button", { class: "btn primary", onclick: () => reveal() }, "Show answer"));
    stage.replaceChildren(
      el("div", { class: "rv-card" },
        el("div", { class: "rv-head" },
          el("div", { class: "tags" }, langBadge(c.lang), c.new ? el("span", { class: "badge" }, "New") : el("span", {}, `Review ${c.reps + 1}`),
            c.cefr ? el("span", { class: "cefr cefr-" + c.cefr[0] }, c.cefr) : null),
          favButton(c)),
        ...front, ui.show, ui.answer),
      el("div", { class: "kbd-hint" }, "Space or Enter shows the answer · 1 Again · 2 Hard · 3 Good · 4 Easy"));
    if (ui.input && !COARSE) ui.input.focus();
  }

  function reveal() {
    if (revealed || !cur) return;
    revealed = true;
    const c = cur, ex = c.example;
    let suggest = 3;
    if (ui.gap) { ui.gap.textContent = ex.word; ui.gap.classList.add("filled"); ui.gap.removeAttribute("aria-label"); }
    const typed = ui.input?.value.trim();
    if (ui.input) ui.input.disabled = true;
    const check = typed ? (() => {
      const ok = [ex?.word, c.lemma, c.stressed].some((x) => x && normWord(x) === normWord(typed));
      if (!ok) suggest = 1;
      return el("div", { class: "rv-check " + (ok ? "ok" : "bad") }, ok ? "Correct." : `Not quite: you wrote “${typed}”.`);
    })() : null;
    const ctx = ex && ex.gloss_in_context && ex.gloss_in_context !== c.gloss ? ex.gloss_in_context : null;
    const rate = el("div", { class: "rv-rate" }, [[1, "Again", "again"], [2, "Hard", ""], [3, "Good", "primary"], [4, "Easy", ""]].map(([g, l, cls]) =>
      el("button", { type: "button", class: "btn " + cls, "data-rating": g, onclick: () => rateCard(g) }, l, el("small", {}, c.labels[g]))));
    ui.show.remove();
    ui.answer.replaceChildren(el("div", { class: "rv-answer" },
      check,
      el("div", { class: "lemma-line" },
        el("span", { class: "lemma", lang: c.lang }, c.stressed || c.lemma),
        speakButton(() => c.lemma, c.lang, { label: "Listen to the dictionary form" }),
        el("span", { class: "pos" }, c.pos)),
      el("div", { class: "gloss" }, c.gloss || "—"),
      ctx ? el("div", { class: "kv" }, el("span", { class: "k" }, "Here"), ctx) : null,
      c.other_meanings.length ? el("div", { class: "kv" }, el("span", { class: "k" }, "Also"), c.other_meanings.join("; ")) : null,
      ex && ex.translation ? el("div", { class: "rv-tr" }, ex.translation) : null,
      rv.mode === "recall" && ex && ex.word ? el("div", { class: "rv-tr" }, speakButton(() => ex.before + ex.word + ex.after, c.lang, { label: "Listen to the sentence" }), " Listen to the sentence") : null,
      c.notes ? el("div", { class: "notes" }, c.notes) : null,
      rate,
      el("div", { class: "rv-foot" },
        el("button", { class: "link", onclick: markKnown }, "I know this word: stop reviewing it"),
        el("a", { href: "#/vocab?q=" + encodeURIComponent(c.lemma) + "&lang=" + c.lang }, "In vocabulary →"))));
    rate.querySelector(`[data-rating="${suggest}"]`)?.focus({ preventScroll: true });
  }

  async function rateCard(g) {
    if (!revealed || busy || !cur) return;
    busy = true;
    try {
      const r = await api(`/api/review/${cur.id}`, { method: "POST", body: { rating: g } });
      done++;
      if (r.card) { queue.push(r.card); total++; }
    } catch (err) { toast(err.message, "error"); busy = false; return; }
    next();
  }

  async function markKnown() {
    if (busy || !cur) return;
    busy = true;
    try {
      await api(`/api/vocab/${cur.id}`, { method: "PATCH", body: { status: "known" } });
      toast(`“${cur.lemma}” marked as known`);
      queue = queue.filter((x) => x.id !== cur.id);
      done++;
    } catch (err) { toast(err.message, "error"); busy = false; return; }
    next();
  }

  reviewKeys = (e) => {
    if (!cur || e.metaKey || e.ctrlKey || e.altKey || document.querySelector("dialog[open]")) return;
    const typing = e.target.closest?.("input, textarea, select");
    if (!revealed && (e.key === " " || e.key === "Enter") && !typing) { e.preventDefault(); reveal(); }
    else if (revealed && /^[1-4]$/.test(e.key) && !typing) { e.preventDefault(); rateCard(Number(e.key)); }
  };

  view.replaceChildren(el("div", { class: "rv-wrap" },
    el("div", { class: "page-head" }, el("h1", {}, "Review")),
    el("div", { class: "rv-tools" }, codes.length > 1 ? langSel : null, modeSeg, starBtn,
      el("label", {}, "New words per day", perDay)),
    meta, el("div", { class: "rv-bar" }, barFill),
    stage));
  load();
}

(async () => {
  try {
    const [langs, models] = await Promise.all([api("/api/languages"), api("/api/models")]);
    setLanguages(langs); MODELS = models;
    TTS = await api("/api/tts/config").catch(() => TTS);
  }
  catch (e) { view.replaceChildren(errorCard(e)); return; }
  route();
})();
